# ============================================================================
# hushsend-stun-server — coturn configuration: STUN ONLY, no relay, no logging
# ============================================================================
# Copy to /etc/turnserver.conf. Every choice below is deliberate; the comments
# say why, because the value of this host is entirely in what it REFUSES to do.
#
# Verified against coturn 4.6.1: the server starts with this file, answers STUN,
# and refuses relay allocations. See DEPLOY.md § 4 for how to re-check that on
# your own host — do not take it on faith from this comment.
# ----------------------------------------------------------------------------

# --- Listening ---------------------------------------------------------------
# Bind everywhere; on a cloud VM behind 1:1 NAT you MUST also set external-ip,
# or the server reports the private address back to clients and every reflexive
# candidate it hands out is useless.
listening-ip=0.0.0.0
listening-port=3478
# external-ip=<PUBLIC.IP>                    # uncomment behind NAT (or PRIVATE/PUBLIC)

# Set EXPLICITLY even though we serve no TLS. coturn opens a TLS/TCP listener
# regardless, and when this is unset it falls back to the DEFAULT 3478 rather
# than to your listening-port — which collides the moment anything else on the
# box already holds 3478 (a second coturn, for instance) and takes the whole
# server down with "Cannot bind TLS/TCP listener socket". Measured, not guessed.
# TLS/DTLS listener. NOTE (verified 2026-09-18 by starting this exact config): with no cert-file /
# pkey-file configured, coturn accepts this line, logs nothing about it, and simply DOES NOT LISTEN
# on the port — `stuns:`/`turns:` URLs pointing here will silently fail to connect. The line is kept
# because a deployment that adds a certificate wants it, but do not advertise a `stuns:` endpoint
# until you have added cert-file/pkey-file AND confirmed the port is listening (`ss -ltn | grep 5349`).
tls-listening-port=5349

# --- RELAY: OFF, and here is the mechanism -----------------------------------
# coturn has NO "STUN only" switch. What it has is the RFC's own rule: a TURN
# ALLOCATE must be authenticated, while a STUN binding request must not. So a
# server with NO authentication configured at all cannot hand out a relay — every
# allocation is refused for want of credentials — while plain STUN keeps working.
# That is why there is no lt-cred-mech, no use-auth-secret, no static-auth-secret
# and no user= line anywhere in this file. Their ABSENCE is the control.
#
# ⚠️ Do NOT "improve" this by adding `no-udp-relay` and `no-tcp-relay` together:
# coturn rejects that pair outright ("CONFIG ERROR: --no-udp-relay and
# --no-tcp-relay options cannot be used together") and then DISCARDS THIS ENTIRE
# FILE, falling back to its defaults — which do relay, and do log. A config that
# looks stricter and silently does the opposite is the worst outcome available
# here, so the check in DEPLOY.md § 4 exists to catch exactly it.
#
# A relay would put this operator on the media path, which is the position the
# separation of STUN from signaling exists to keep everyone out of.

# --- Defence in depth ---------------------------------------------------------
# If a future edit ever does enable relaying, these stop it being used as a
# reflector into private address space. They cost nothing today.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# --- Logging: OFF. The addresses are the sensitive part. ---------------------
# This server necessarily SEES the IP and port of everyone who asks. It must not
# REMEMBER them: a STUN log is a record of who used a privacy tool and when,
# which is the metadata this product's users are most exposed by.
no-stdout-log
log-file=/dev/null
simple-log

# --- Denial of service hygiene ------------------------------------------------
# STUN is cheap to answer and cheap to flood; these bound the damage without
# needing to know anything about the clients.
max-bps=64000
user-quota=0
total-quota=0

# --- Identity -----------------------------------------------------------------
# Cosmetic for STUN-only operation, but coturn wants a realm.
realm=<YOUR.STUN.HOSTNAME>
# Do not advertise the version to the internet.
no-software-attribute
