name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: template on a real coturn (stun-only, no relay, no logs)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Ubuntu's coturn is 4.6.1 — what netcup runs. The package starts its own coturn.service
      # on 3478; check.sh uses 34790/34794 and never touches it.
      - name: Install coturn
        run: sudo apt-get update -qq && sudo apt-get install -y coturn
      - name: Shell scripts parse
        run: for f in *.sh; do bash -n "$f"; done
      - name: The template renders and coturn runs it as STUN-only (with a negative control)
        run: bash check.sh
